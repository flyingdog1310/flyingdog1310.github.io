<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121213">
    <title>Tetris</title>
    <link rel="stylesheet" href="../../shared/tokens.css">
    <link rel="stylesheet" href="../../shared/game-shell.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="stage">
    <!-- 圖示：之後以 <use href="#i-…"> 引用 -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></symbol>
        <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></symbol>
        <symbol id="i-down" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7" /></symbol>
        <symbol id="i-drop" viewBox="0 0 24 24"><path d="M5 5l7 7 7-7M5 11l7 7 7-7" /><path d="M5 21h14" /></symbol>
        <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66" /><path d="M20 4v5h-5" /></symbol>
        <symbol id="i-hold" viewBox="0 0 24 24"><path d="M7 7h10v10H7z" /><path d="M4 12h3M17 12h3" /></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" /></symbol>
    </svg>

    <main class="tetris" data-state="ready">
        <aside class="panel panel--left">
            <button class="slot slot--hold" id="hold-slot" type="button" aria-label="Hold piece">
                <span class="slot__label">Hold</span>
                <canvas class="preview" id="hold" aria-hidden="true"></canvas>
            </button>
            <dl class="stats">
                <div class="stat stat--score">
                    <dt>Score</dt>
                    <dd id="score">0</dd>
                </div>
                <div class="stat">
                    <dt>Level</dt>
                    <dd id="level">1</dd>
                </div>
                <div class="stat">
                    <dt>Lines</dt>
                    <dd id="lines">0</dd>
                </div>
                <div class="stat stat--best">
                    <dt>Best</dt>
                    <dd id="best">–</dd>
                </div>
            </dl>
        </aside>

        <div class="well-area" id="well-area">
            <div class="well" id="well">
                <canvas id="board" role="img" aria-label="Tetris playfield"></canvas>
                <p class="callout" id="callout" aria-live="polite"></p>

                <div class="overlay" id="overlay-ready">
                    <h1 class="overlay__title">Tetris</h1>
                    <table class="keys only-fine" aria-label="Keyboard controls">
                        <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>Move</td></tr>
                        <tr><td><kbd>↑</kbd> <kbd>Z</kbd></td><td>Rotate</td></tr>
                        <tr><td><kbd>↓</kbd></td><td>Soft drop</td></tr>
                        <tr><td><kbd>Space</kbd></td><td>Hard drop</td></tr>
                        <tr><td><kbd>C</kbd></td><td>Hold</td></tr>
                        <tr><td><kbd>P</kbd></td><td>Pause</td></tr>
                    </table>
                    <ul class="gestures only-coarse">
                        <li>Tap to rotate</li>
                        <li>Drag to move</li>
                        <li>Flick down to drop</li>
                        <li>Flick up to hold</li>
                    </ul>
                    <button class="btn" type="button" data-action="start">Start game</button>
                </div>

                <div class="overlay" id="overlay-paused" hidden>
                    <h2 class="overlay__title">Paused</h2>
                    <button class="btn" type="button" data-action="resume">Resume</button>
                    <button class="btn btn--quiet" type="button" data-action="restart">Restart</button>
                </div>

                <div class="overlay" id="overlay-over" hidden>
                    <h2 class="overlay__title">Game over</h2>
                    <p class="final-score" id="final-score">0</p>
                    <p class="final-note" id="final-note"></p>
                    <button class="btn" type="button" data-action="restart">Play again</button>
                </div>
            </div>
        </div>

        <aside class="panel panel--right">
            <div class="slot slot--next">
                <span class="slot__label">Next</span>
                <canvas class="preview" id="next" aria-hidden="true"></canvas>
            </div>
            <button class="icon-btn" id="pause-btn" type="button" aria-label="Pause">
                <svg><use href="#i-pause" /></svg>
            </button>
        </aside>

        <div class="pad" aria-label="Touch controls">
            <div class="pad__group">
                <button class="pad__btn" type="button" data-hold="left" aria-label="Move left"><svg><use href="#i-left" /></svg></button>
                <button class="pad__btn" type="button" data-hold="down" aria-label="Soft drop"><svg><use href="#i-down" /></svg></button>
                <button class="pad__btn" type="button" data-hold="right" aria-label="Move right"><svg><use href="#i-right" /></svg></button>
            </div>
            <div class="pad__group">
                <button class="pad__btn" type="button" data-tap="hold" aria-label="Hold"><svg><use href="#i-hold" /></svg></button>
                <button class="pad__btn" type="button" data-tap="drop" aria-label="Hard drop"><svg><use href="#i-drop" /></svg></button>
                <button class="pad__btn pad__btn--main" type="button" data-tap="rotate" aria-label="Rotate"><svg><use href="#i-rotate" /></svg></button>
            </div>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>

</html>
