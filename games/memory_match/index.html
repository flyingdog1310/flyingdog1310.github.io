<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121213">
    <title>Memory Match</title>
    <link rel="stylesheet" href="../../shared/tokens.css">
    <link rel="stylesheet" href="../../shared/game-shell.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="stage">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">

        <symbol id="s2" viewBox="0 0 24 24"><path class="fill" d="M19.5 14.6A8 8 0 1 1 9.4 4.5a6.5 6.5 0 0 0 10.1 10.1z" /><path class="detail" d="M16.5 4.5v3M15 6h3" /></symbol>

        <symbol id="s4" viewBox="0 0 24 24"><path class="fill" d="M13.5 2.5L5 13.5h6l-1 8 8.5-11h-6z" /></symbol>
        <symbol id="s5" viewBox="0 0 24 24"><path class="fill" d="M12 3s6.2 6.8 6.2 11.3a6.2 6.2 0 0 1-12.4 0C5.8 9.8 12 3 12 3z" /><path class="detail" d="M9.3 14.5a2.8 2.8 0 0 0 2.2 2.6" /></symbol>
        <symbol id="s6" viewBox="0 0 24 24"><path class="fill" d="M5 19.5C4.5 10.5 10 4.5 20 4c-.2 9.5-5.5 15.5-15 15.5z" /><path class="detail" d="M5 19.5L14 10" /></symbol>
        <symbol id="s7" viewBox="0 0 24 24"><path class="fill" d="M7.5 4h9l4 5L12 20.5 3.5 9z" /><path class="detail" d="M3.5 9h17M9.5 4L8 9l4 11.5L16 9l-1.5-5" /></symbol>
        <symbol id="s8" viewBox="0 0 24 24"><path class="fill" d="M3.5 8l4.5 4.5L12 5.5l4 7 4.5-4.5-1.8 10.5H5.3z" /><circle class="detail-fill" cx="12" cy="15.5" r="1.3" /></symbol>
        <symbol id="s9" viewBox="0 0 24 24"><path d="M9 17.5V5.5l10-2v12" /><circle class="fill" cx="6.5" cy="17.5" r="2.5" /><circle class="fill" cx="16.5" cy="15.5" r="2.5" /></symbol>

        <symbol id="s14" viewBox="0 0 24 24"><path class="fill" d="M12 8c-2-1.6-7-1.4-7 4.4 0 4.6 2.8 8.6 4.8 8.6 1 0 1.4-.6 2.2-.6s1.2.6 2.2.6c2 0 4.8-4 4.8-8.6C19 6.6 14 6.4 12 8z" /><path d="M12 8c0-2.2.8-3.8 2.8-5" /></symbol>
        <symbol id="s15" viewBox="0 0 24 24"><circle class="fill" cx="7.5" cy="12" r="4.3" /><circle class="detail-fill" cx="7.5" cy="12" r="1.4" /><path d="M11.8 12H21v3.5M17.5 12v2.5" /></symbol>
        <symbol id="s16" viewBox="0 0 24 24"><circle class="fill" cx="12" cy="7" r="3.4" /><circle class="fill" cx="17" cy="12" r="3.4" /><circle class="fill" cx="12" cy="17" r="3.4" /><circle class="fill" cx="7" cy="12" r="3.4" /><circle class="detail-fill" cx="12" cy="12" r="2.2" /></symbol>
        <symbol id="s17" viewBox="0 0 24 24"><circle class="fill" cx="12" cy="12" r="5.3" /><ellipse cx="12" cy="12" rx="10" ry="3.4" transform="rotate(-20 12 12)" /></symbol>
    </svg>

    <main class="memory" data-state="ready">
        <header class="hud">
            <dl class="stats">
                <div class="stat">
                    <dt>Moves</dt>
                    <dd id="moves">0</dd>
                </div>
                <div class="stat">
                    <dt>Pairs</dt>
                    <dd><span id="pairs">0</span><span class="stat__of">/<span id="pairs-total">10</span></span></dd>
                </div>
                <div class="stat">
                    <dt>Time</dt>
                    <dd id="time">0:00</dd>
                </div>
                <div class="stat stat--best">
                    <dt>Best</dt>
                    <dd id="best">–</dd>
                </div>
            </dl>
            <button class="icon-btn" id="pause-btn" type="button" aria-label="Pause">
                <svg><use href="#i-pause" /></svg>
            </button>
            <button class="icon-btn" id="new-btn" type="button" aria-label="New game" title="New game">
                <svg><use href="#i-new" /></svg>
            </button>
        </header>

        <div class="levels" role="group" aria-label="Difficulty">
            <button class="level" type="button" data-level="easy">Easy</button>
            <button class="level" type="button" data-level="normal">Normal</button>
            <button class="level" type="button" data-level="hard">Hard</button>
        </div>

        <div class="board-area" id="board-area">
            <div class="board-wrap">
                <div class="board" id="board" role="group" aria-label="Cards" aria-describedby="status"></div>

                <div class="overlay" id="overlay-ready">
                    <h1 class="overlay__title">Memory Match</h1>
                    <p class="overlay__text">Flip two cards at a time and find every matching pair in as few moves as you can.</p>
                    <p class="overlay__text overlay__text--small only-fine">Arrow keys and <kbd>Space</kbd> work too.</p>
                    <button class="btn" type="button" data-action="start">Start game</button>
                </div>

                <div class="overlay" id="overlay-paused" hidden>
                    <h2 class="overlay__title">Paused</h2>
                    <button class="btn" type="button" data-action="resume">Resume</button>
                </div>

                <div class="overlay overlay--result" id="overlay-won" hidden>
                    <div class="result-card">
                        <h2 class="overlay__title">All matched</h2>
                        <p class="final-score"><span id="won-moves">0</span> <span class="final-unit">moves</span></p>
                        <p class="final-detail" id="won-detail"></p>
                        <p class="final-note" id="won-note"></p>
                        <button class="btn" type="button" data-action="restart">Play again</button>
                    </div>
                </div>

                <div class="overlay" id="overlay-confirm" hidden>
                    <h2 class="overlay__title">Start over?</h2>
                    <p class="overlay__text">Your current game will be lost.</p>
                    <button class="btn" type="button" data-action="confirm">New game</button>
                    <button class="btn btn--quiet" type="button" data-action="cancel">Cancel</button>
                </div>
            </div>
        </div>

        <p class="visually-hidden" id="status" aria-live="polite"></p>
    </main>

    <script type="module" src="script.js"></script>
</body>

</html>
