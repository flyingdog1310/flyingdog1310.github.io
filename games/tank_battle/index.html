<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121213">
    <title>Tank Battle</title>
    <link rel="stylesheet" href="../../shared/tokens.css">
    <link rel="stylesheet" href="../../shared/game-shell.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="stage">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" /></symbol>
        <symbol id="i-fire" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4" /></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" /></symbol>
        <symbol id="i-tank" viewBox="0 0 16 16"><path d="M1 4h4v10H1zM11 4h4v10h-4zM5 6h6v7H5z" /><path d="M7 1h2v7H7z" /></symbol>
    </svg>

    <main class="tanks" data-state="ready">
        <header class="hud">
            <dl class="stats">
                <div class="stat stat--score">
                    <dt>Score</dt>
                    <dd id="score">0</dd>
                </div>
                <div class="stat stat--best">
                    <dt>Best</dt>
                    <dd id="best">–</dd>
                </div>
                <div class="stat">
                    <dt>Stage</dt>
                    <dd id="stage">1</dd>
                </div>
                <div class="stat">
                    <dt>Lives</dt>
                    <dd class="icons icons--lives" id="lives" aria-label="3 lives"></dd>
                </div>
                <div class="stat">
                    <dt>Enemies</dt>
                    <dd class="icons icons--enemies" id="enemies" aria-label="20 enemies left"></dd>
                </div>
            </dl>
            <button class="icon-btn" id="pause-btn" type="button" aria-label="Pause">
                <svg><use href="#i-pause" /></svg>
            </button>
        </header>

        <div class="field-area" id="field-area">
            <div class="field" id="field">
                <canvas id="board" role="img" aria-label="Tank Battle playfield"></canvas>
                <p class="callout" id="callout" aria-live="polite"></p>

                <div class="overlay" id="overlay-ready">
                    <h1 class="overlay__title">Tank Battle</h1>
                    <p class="overlay__text">Defend the eagle and destroy all 20 enemy tanks to clear each stage. Shoot the flashing tanks for power-ups.</p>
                    <table class="keys only-fine" aria-label="Keyboard controls">
                        <tr><td class="nowrap"><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd></td><td>Move</td></tr>
                        <tr><td class="nowrap"><kbd>Space</kbd> or <kbd>J</kbd></td><td>Fire, hold to keep firing</td></tr>
                    </table>
                    <p class="overlay__text only-coarse">Drag on the stick to drive. Hold the fire button to keep firing.</p>
                    <button class="btn" type="button" data-action="start">Start game</button>
                </div>

                <div class="overlay" id="overlay-paused" hidden>
                    <h2 class="overlay__title">Paused</h2>
                    <button class="btn" type="button" data-action="resume">Resume</button>
                    <button class="btn btn--quiet" type="button" data-action="restart">Restart</button>
                </div>

                <div class="overlay" id="overlay-over" hidden>
                    <h2 class="overlay__title" id="over-title">Game over</h2>
                    <p class="final-score" id="final-score">0</p>
                    <p class="final-note" id="final-note"></p>
                    <button class="btn" type="button" data-action="restart">Play again</button>
                </div>
            </div>
        </div>

        <div class="pad" aria-label="Touch controls">
            <div class="stick" id="stick" role="group" aria-label="Drive">
                <span class="stick__arrow" data-dir="up"><svg><use href="#i-up" /></svg></span>
                <span class="stick__arrow" data-dir="right"><svg><use href="#i-up" /></svg></span>
                <span class="stick__arrow" data-dir="down"><svg><use href="#i-up" /></svg></span>
                <span class="stick__arrow" data-dir="left"><svg><use href="#i-up" /></svg></span>
                <span class="stick__knob" id="stick-knob"></span>
            </div>
            <button class="pad__btn pad__btn--main fire-btn" id="fire-btn" type="button" aria-label="Fire"><svg><use href="#i-fire" /></svg></button>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>

</html>
