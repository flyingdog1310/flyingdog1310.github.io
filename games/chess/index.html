<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121213">
    <title>Chess</title>
    <link rel="stylesheet" href="../../shared/tokens.css">
    <link rel="stylesheet" href="../../shared/game-shell.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="stage">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <symbol id="i-new" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 4v7h-7" /></symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></symbol>
        <!-- 棋子：viewBox 45 × 45；主體的填色與外框由外層設定，細節線條用 --pd -->
        <symbol id="p-p" viewBox="0 0 45 45"><path d="M13 40.5h19a1.5 1.5 0 0 0 1.5-1.5v-1a2 2 0 0 0-2-2h-18a2 2 0 0 0-2 2v1a1.5 1.5 0 0 0 1.5 1.5z"/><path d="M15.5 36c0-4.6 2.3-8.3 4.6-10.5h4.8c2.3 2.2 4.6 5.9 4.6 10.5z"/><path d="M17.5 26.5h10a1.5 1.5 0 0 0 0-3h-10a1.5 1.5 0 0 0 0 3z"/><circle cx="22.5" cy="17" r="6"/></symbol>
        <symbol id="p-r" viewBox="0 0 45 45"><path d="M10 40.5h25a1.5 1.5 0 0 0 1.5-1.5v-1.5a2 2 0 0 0-2-2h-24a2 2 0 0 0-2 2V39a1.5 1.5 0 0 0 1.5 1.5z"/><path d="M12.5 35.5h20v-3h-20z"/><path d="M14.5 32.5h16l-1.3-14.5h-13.4z"/><path d="M12.5 18h20v-3.5h-20z"/><path d="M12.5 14.5V8h4.2v3h3.7V8h4.2v3h3.7V8h4.2v6.5z"/><path d="M15.5 21h14" style="fill:none;stroke:var(--pd)"/></symbol>
        <symbol id="p-n" viewBox="0 0 45 45"><path d="M10 40.5h25a1.5 1.5 0 0 0 1.5-1.5v-1.5a2 2 0 0 0-2-2h-24a2 2 0 0 0-2 2V39a1.5 1.5 0 0 0 1.5 1.5z"/><path d="M13 35.5c0-5.5 2.5-8.8 6.2-11.8.9-.8 1.2-1.6 1-2.4-2.3 1.4-4.8 1.6-6.7 1.3-1.7-.3-3.3-1.4-3.4-3-.1-1.8 1-3.4 2.3-5.2 1.6-2.2 3.4-3.6 4.8-4.5L17.8 6l3.2 2.6.4-.1L23.6 5l1.6 4c5.6 1.5 8.8 6.6 8.8 13.7 0 5.2-1.6 9.3-1.6 12.8z"/><circle cx="16.4" cy="13.6" r="1.1" style="fill:var(--pd);stroke:none"/><path d="M12 19.2c.6-.1 1.2-.4 1.6-.9" style="fill:none;stroke:var(--pd)"/><path d="M24.6 11c3.6 1.6 6 5.4 6.2 11.5" style="fill:none;stroke:var(--pd)"/></symbol>
        <symbol id="p-b" viewBox="0 0 45 45"><path d="M10 40.5h25a1.5 1.5 0 0 0 1.5-1.5v-1.5a2 2 0 0 0-2-2h-24a2 2 0 0 0-2 2V39a1.5 1.5 0 0 0 1.5 1.5z"/><path d="M15.5 35.5c.8-3.8 2.3-6.8 3.7-9h6.6c1.4 2.2 2.9 5.2 3.7 9z"/><path d="M17 27h11a1.5 1.5 0 0 0 0-3H17a1.5 1.5 0 0 0 0 3z"/><circle cx="22.5" cy="6.8" r="2.2"/><path d="M22.5 9c-4.3 3.4-7.2 7.5-7.2 10.8 0 1.6.8 3 1.8 4.2h10.8c1-1.2 1.8-2.6 1.8-4.2 0-3.3-2.9-7.4-7.2-10.8z"/><path d="M25.2 13.6l-4.4 4.4" style="fill:none;stroke:var(--pd)"/></symbol>
        <symbol id="p-q" viewBox="0 0 45 45"><path d="M10 40.5h25a1.5 1.5 0 0 0 1.5-1.5v-1.5a2 2 0 0 0-2-2h-24a2 2 0 0 0-2 2V39a1.5 1.5 0 0 0 1.5 1.5z"/><path d="M12.5 35.5L10 16.5l4.6 8.8 1.6-12.2 4.1 11.4 2.2-13 2.2 13 4.1-11.4 1.6 12.2 4.6-8.8-2.5 19z"/><circle cx="10" cy="15" r="2"/><circle cx="16.2" cy="11.6" r="2"/><circle cx="22.5" cy="9.8" r="2"/><circle cx="28.8" cy="11.6" r="2"/><circle cx="35" cy="15" r="2"/><path d="M13.2 31.2c6.2-1.8 12.4-1.8 18.6 0" style="fill:none;stroke:var(--pd)"/></symbol>
        <symbol id="p-k" viewBox="0 0 45 45"><path d="M10 40.5h25a1.5 1.5 0 0 0 1.5-1.5v-1.5a2 2 0 0 0-2-2h-24a2 2 0 0 0-2 2V39a1.5 1.5 0 0 0 1.5 1.5z"/><path d="M21.2 4h2.6v3h3v2.6h-3v5h-2.6v-5h-3V7h3z"/><path d="M12.5 35.5c-.6-3.6-3-6.6-3-10.3 0-3.6 2.7-6.2 6.2-6.2 2.8 0 5 1.6 6.8 4 1.8-2.4 4-4 6.8-4 3.5 0 6.2 2.6 6.2 6.2 0 3.7-2.4 6.7-3 10.3z"/><path d="M22.5 23c-1.3-2-1.9-3.9-1.9-5.4 0-1.3.8-2.4 1.9-3 1.1.6 1.9 1.7 1.9 3 0 1.5-.6 3.4-1.9 5.4z"/><path d="M13.2 31.2c6.2-1.8 12.4-1.8 18.6 0M22.5 23v8" style="fill:none;stroke:var(--pd)"/></symbol>
    </svg>

    <main class="chess" data-state="ready" data-mode="cpu">
        <header class="hud">
            <div class="score">
                <div class="side" id="side-a" data-side="w">
                    <span class="side__name"><span id="name-a">You</span> <span class="side__wins" id="wins-a"></span></span>
                    <svg class="side__piece" aria-hidden="true"><use href="#p-k" /></svg>
                    <span class="side__taken" id="taken-a"></span>
                </div>
                <div class="side side--draw">
                    <span class="side__name">Draws</span>
                    <span class="side__count" id="draws">0</span>
                </div>
                <div class="side side--right" id="side-b" data-side="b">
                    <span class="side__name"><span id="name-b">Computer</span> <span class="side__wins" id="wins-b"></span></span>
                    <svg class="side__piece" aria-hidden="true"><use href="#p-k" /></svg>
                    <span class="side__taken" id="taken-b"></span>
                </div>
            </div>
            <div class="hud__buttons">
                <button class="icon-btn" id="undo-btn" type="button" aria-label="Undo" title="Undo (U)">
                    <svg><use href="#i-undo" /></svg>
                </button>
                <button class="icon-btn" id="new-btn" type="button" aria-label="New game" title="New game (N)">
                    <svg><use href="#i-new" /></svg>
                </button>
            </div>
        </header>

        <div class="levels" role="group" aria-label="Opponent">
            <button class="level" type="button" data-opponent="easy">Easy</button>
            <button class="level" type="button" data-opponent="normal">Normal</button>
            <button class="level" type="button" data-opponent="hard">Hard</button>
            <button class="level" type="button" data-opponent="duo">2 players</button>
        </div>

        <div class="board-area">
            <div class="board-wrap">
                <div class="coords coords--cols" aria-hidden="true" id="coords-cols"></div>
                <div class="coords coords--rows" aria-hidden="true" id="coords-rows"></div>
                <div class="board">
                    <div class="cells" id="cells" role="group" aria-label="Board" aria-describedby="status"></div>
                    <div class="promo" id="promo" hidden>
                        <div class="promo__veil" data-action="promo-cancel"></div>
                        <div class="promo__list" id="promo-list" role="group" aria-label="Promote pawn to"></div>
                    </div>
                </div>

                <div class="overlay" id="overlay-ready">
                    <h1 class="overlay__title">Chess</h1>
                    <p class="overlay__text">Checkmate the opposing king. Full rules — castling, en passant, promotion
                        and every kind of draw.</p>
                    <table class="keys only-fine">
                        <tr><td><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> <kbd>Space</kbd></td><td>Select and move</td></tr>
                        <tr><td><kbd>Esc</kbd></td><td>Cancel selection</td></tr>
                        <tr><td><kbd>U</kbd> <kbd>N</kbd></td><td>Undo · New game</td></tr>
                    </table>
                    <p class="overlay__text only-coarse">Tap a piece, then tap where it goes — or drag it.</p>
                    <button class="btn" type="button" data-action="start">Start game</button>
                </div>

                <div class="overlay overlay--result" id="overlay-over" hidden>
                    <div class="result-card">
                        <h2 class="overlay__title" id="over-title">You win</h2>
                        <p class="final-reason" id="over-reason"></p>
                        <p class="final-detail" id="over-detail"></p>
                        <p class="final-note" id="over-note"></p>
                        <button class="btn" type="button" data-action="restart">Play again</button>
                    </div>
                </div>

                <div class="overlay" id="overlay-confirm" hidden>
                    <h2 class="overlay__title">Start over?</h2>
                    <p class="overlay__text">The current game will be lost.</p>
                    <button class="btn" type="button" data-action="confirm">New game</button>
                    <button class="btn btn--quiet" type="button" data-action="cancel">Cancel</button>
                </div>
            </div>

            <div class="info">
                <p class="turn" id="turn"></p>
                <p class="note" id="note"></p>
                <ol class="moves" id="moves" aria-label="Moves"></ol>
            </div>
        </div>

        <p class="visually-hidden" id="status" aria-live="polite"></p>
    </main>

    <script type="module" src="script.js"></script>
</body>

</html>
